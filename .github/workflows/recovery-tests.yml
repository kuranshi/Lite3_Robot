name: Recovery offline tests
on:
  push:
    paths: ['recovery/**', 'pytest.ini', '.github/workflows/recovery-tests.yml']
  pull_request:
    paths: ['recovery/**', 'pytest.ini', '.github/workflows/recovery-tests.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r recovery/requirements-dev.txt
      - run: python -m pytest -q
      - run: python recovery/scripts/check_export.py
